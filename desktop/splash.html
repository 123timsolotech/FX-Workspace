<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>FX Workspace</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #1f1e1c; color: #ece9e2;
         font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Ubuntu, sans-serif; user-select: none;
         -webkit-app-region: drag; }        /* no system title bar: the whole loading screen moves the window */
  .box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  img { width: 92px; height: 92px; animation: breathe 2.4s ease-in-out infinite; }
  h1 { margin: 0; font-weight: 300; font-size: 22px; letter-spacing: .04em; }
  p { margin: 0; color: #a39f96; min-height: 21px; }
  .bar { width: 180px; height: 3px; border-radius: 3px; background: #33312d; overflow: hidden; }
  .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #f8c94a, #e79c1e);
           animation: slide 1.3s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @keyframes breathe { 50% { transform: scale(1.04); } }
  @media (prefers-reduced-motion: reduce) { img, .bar i { animation: none; } }
</style>
</head>
<body>
  <div class="box" role="status" aria-live="polite">
    <img src="assets/icon.png" alt="">
    <h1>FX Workspace</h1>
    <div class="bar"><i></i></div>
    <p id="status">Starting…</p>
  </div>
<script>
  window.setStatus = text => { document.getElementById('status').textContent = text; };
</script>
</body>
</html>
