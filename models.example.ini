; Chat models for llama.cpp's router (llama-server --models-preset).
;
; The easy way: put .gguf files in the "local\models" folder and press
; Settings > Models > Scan for models. Each new file gets its own [section]
; at the end of models.ini, named after the file. A vision model's projector
; (a file with "mmproj" in its name, in the same folder) is attached for you.
;
; You can also add one by hand - a [name] and the file's full path:
;
;   [My-Model]
;   model = D:\models\my-model-Q4_K_M.gguf
;   mmproj = D:\models\my-model-mmproj-f16.gguf
;   ctx-size = 16384
;
; Lines in a model's own section override the [*] defaults below.
; Settings > Models > Resources edits ngl / ctx-size / batch-size for you.
;
; models.ini is created from this file on the first start and is yours:
; it is not part of the repository (see .gitignore).

[*]
; Layers on the GPU: "auto" lets llama.cpp fit the model into your VRAM.
ngl = auto
; The context window (tokens). 16384 fits small GPUs; raise it per model.
ctx-size = 16384
batch-size = 1024
; MB of VRAM llama.cpp leaves free when it fits a model.
fit-target = 256
